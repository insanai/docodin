name: Website

on:
  workflow_run:
    workflows: [Verify]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-main
  cancel-in-progress: true

jobs:
  build:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.19'
          enable-cache: true
      - name: Install checksum-verified Odin
        run: |
          uv run --no-project python scripts/install_odin.py "$RUNNER_TEMP/odin" > "$RUNNER_TEMP/odin-path"
          cat "$RUNNER_TEMP/odin-path" >> "$GITHUB_PATH"
      - name: Build native publisher
        run: |
          mkdir -p bin
          odin build cmd/docodin -o:speed -vet -strict-style -out:bin/docodin
      - name: Install PDF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-luatex texlive-xetex \
            texlive-latex-extra texlive-fonts-recommended fonts-linuxlibertine \
            librsvg2-bin poppler-utils graphviz
          echo "TEXMFHOME=$RUNNER_TEMP/texmf" >> "$GITHUB_ENV"
          uv run --no-project python scripts/install_pdf_fonts.py "$RUNNER_TEMP/texmf"
      - name: Build the book and individual design record PDFs
        run: uv run --no-project python scripts/build_documentation_pdfs.py
      - name: Build homepage, book and design records
        run: uv run --no-project python scripts/build_site.py --pdf-dir build/pdf
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: build/site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages-production
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
