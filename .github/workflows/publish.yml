name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published GitHub release tag to retry
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pypi
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      RELEASE_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Verification policy comes from this workflow's immutable revision;
          # package identity and provenance come from the release tag below.
          ref: ${{ github.workflow_sha }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          path: release-source
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.19'
      - name: Download and verify the published, qualified artifacts
        run: |
          gh release view "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" --json isDraft > release.json
          uv run --no-project python -c 'import json; assert not json.load(open("release.json"))["isDraft"], "Release is still a draft"'
          gh release download "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" --dir dist
          uv run --no-project python scripts/package_release.py --verify dist --tag "$RELEASE_TAG" \
            --revision "$(git -C release-source rev-parse HEAD)" --project-root release-source
          VERSION=$(uv run --no-project python scripts/package_release.py --print-version \
            --tag "$RELEASE_TAG" --project-root release-source)
          mkdir publish
          cp dist/*.whl "dist/docodin-$VERSION.tar.gz" publish/
          uvx twine check publish/*
      - name: Publish the tested wheels and source distribution
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: publish/
          attestations: false
