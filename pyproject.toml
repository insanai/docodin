[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "docodin"
version = "0.2.0"
description = "Fast reStructuredText parser written in Odin: a drop-in parser for docutils and Sphinx"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
sphinx = ["sphinx>=8.0"]
test = ["pytest>=8.0", "sphinx>=8.0", "docutils>=0.22"]

[project.scripts]
docodin = "docodin.__main__:main"

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
docodin = ["*.dylib", "*.so", "*.dll"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Project rules: files <= 1408 lines, lines 99 chars (soft) / 108 chars (hard),
# short functions with low cyclomatic complexity.
[tool.ruff]
line-length = 108
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "C90", "PLR0912", "PLR0915", "PLR0911"]
ignore = ["UP031"]  # message texts mirror docutils' %-formatting

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pylint]
max-branches = 14
max-statements = 50
max-returns = 8
