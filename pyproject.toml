[build-system]
requires = ["hatchling>=1.27", "packaging"]
build-backend = "hatchling.build"

[project]
name = "docodin"
version = "0.2.0"
description = "Fast reStructuredText parser written in Odin: a drop-in parser for docutils and Sphinx"
readme = "README.rst"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "NOTICE.rst", "LICENSES/*"]
dependencies = []

[project.optional-dependencies]
sphinx = ["sphinx>=8.0"]
test = ["pytest>=8.0", "sphinx>=8.0", "docutils>=0.22"]

[dependency-groups]
# the documentation (docs/book, docs/dod) with Sphinx: uv run --group docs sphinx-build ...
docs = ["sphinx>=8.0", "furo>=2024.8.6"]

# The wheel also installs the native programs docodin, docodin-check and docodin-lsp
# (hatch_build.py); docodin runs ``python -m docodin`` for what needs Python.
[project.scripts]
docodin-sphinx-build = "docodin.sphinx_build:main"

[tool.hatch.build.targets.wheel]
packages = ["python/docodin"]

[tool.hatch.build.targets.wheel.hooks.custom]  # hatch_build.py: native library, platform tag

[tool.hatch.build.targets.wheel.force-include]
# start-up hook: DOCODIN_DOCUTILS=1 serves docutils from docodin (docodin_autoload.py)
"python/docodin.pth" = "docodin.pth"
"python/docodin_autoload.py" = "docodin_autoload.py"

[tool.hatch.build.targets.sdist]
include = ["/python", "/odin", "/cmd", "/scripts", "/tests", "/docs", "/hatch_build.py",
           "/README.rst", "/CHANGELOG.rst", "/LICENSE", "/NOTICE.rst", "/LICENSES"]
exclude = ["*.dylib", "*.so", "*.dll", "__pycache__"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Project rules: files <= 1408 lines, lines 99 chars (soft) / 108 chars (hard),
# short functions with low cyclomatic complexity.
[tool.ruff]
line-length = 108
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "C90", "PLR0912", "PLR0915", "PLR0911"]
ignore = ["UP031"]  # message texts mirror docutils' %-formatting

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pylint]
max-branches = 14
max-statements = 50
max-returns = 8
